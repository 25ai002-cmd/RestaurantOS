# Netlify Configuration for RestaurantOS (Frontend + Serverless API Functions)

[build]
  command = "npm run db:generate && npm run build"
  publish = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "prisma", "bcryptjs"]
  included_files = ["node_modules/.prisma/**", "apps/api/prisma/**"]

# Route all /api/* requests to the Express Netlify Function on the same origin
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA Fallback for React Router (/login, /register, /dashboard, /admin, /r/:slug, /q/:qrToken)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
